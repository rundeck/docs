name: Documentation bug
description: Report an issue with the Rundeck documentation
title: "[Docs]: "
body:
  - type: input
    id: version
    attributes:
      label: Rundeck Version
      description: Which version of Rundeck is this documentation issue about? Docs can differ across versions, so this helps us confirm whether the content is actually wrong or just describes a different version than the one you're on.
      placeholder: e.g. 6.1.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the documentation issue is.
    validations:
      required: true

  - type: input
    id: source_page
    attributes:
      label: Source page
      description: Link or name of the documentation page that has the issue.
      placeholder: e.g. https://docs.rundeck.com/docs/administration/...
    validations:
      required: true
